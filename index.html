<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPilot AI — Redirecting...</title>
  <script>
    // Root Entrypoint Router: Sign In -> Org Setup -> Dashboard
    const token = localStorage.getItem('finpilot_token');
    const org = localStorage.getItem('finpilot_org_name');
    if (token && org) {
      window.location.replace('frontend/pages/dashboard.html');
    } else if (token && !org) {
      window.location.replace('frontend/pages/org-setup.html');
    } else {
      window.location.replace('frontend/pages/login.html');
    }
  </script>
</head>
<body style="font-family: sans-serif; background: #f5f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p style="color: #626d67; font-size: 14px;">Loading FinPilot AI...</p>
</body>
</html>
